services:
  - type: web
    name: xhs-cover-package-studio
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:web
    envVars:
      - key: APP_MODE
        value: web
      - key: HOST
        value: 0.0.0.0
      - key: MOCK_COPY
        value: "1"
      - key: APP_ACCESS_CODE
        sync: false
      - key: BANANAROUTER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
